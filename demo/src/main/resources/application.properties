# ─── Nombre de la aplicacion ──────────────────────────────────────────────────
spring.application.name=sistema-subastas

# ─── Base de datos PostgreSQL ─────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/subastas
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ─── Subida de archivos multipart ─────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# ─── Directorio local para imagenes de productos ─────────────────────────────
# Cambiar en produccion por una ruta absoluta o usar S3
app.storage.upload-dir=uploads/fotos

# ─── Servidor ─────────────────────────────────────────────────────────────────
server.port=8080

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.sistemadesubastas=INFO
logging.level.org.springframework.security=WARN
